name: Build DeepseekSU Manager (custom)

on:
  workflow_dispatch:
    inputs:
      finasu_ref:
        description: 'FinaSU 分支/标签'
        required: true
        default: 'master'
      api_token:
        description: '在线商店 api.token（留空则用默认提取值）'
        required: false
        default: ''
      manager_package:
        description: '管理器包名（applicationId，留空用默认 me.yuki.fina）'
        required: false
        default: 'ly.deepseek.dsh'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库（用于读取 secrets 与上传）
        uses: actions/checkout@v4
        with:
          path: self

      - name: 克隆 FinaSU 源码
        run: |
          git clone --filter=blob:none https://github.com/tucoluqum48-lab/FinaSU.git fina
          cd fina
          git checkout "${{ github.event.inputs.finasu_ref }}"
          git fetch --tags --force --quiet || true
          # 版本号来自 git describe --tags；fork 若没有 tag 就会退化成提交号
          echo "tag 数: $(git tag | wc -l)  最新: $(git describe --tags --always 2>/dev/null)"
          if [ "$(git describe --tags --always)" = "$(git rev-parse --short HEAD)" ]; then
            echo "!! 没有可用 tag，版本号会显示成提交哈希"
          fi
          echo "commit=$(git rev-parse --short HEAD) count=$(git rev-list --count HEAD) describe=$(git describe --tags --always)"

      - name: 准备签名与 auth.properties
        id: auth
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          API_TOKEN_IN: ${{ github.event.inputs.api_token }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/key.jks"
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/key.jks" -alias "$KEY_ALIAS" \
                 -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: //')
          HASH=$(echo "$FP" | tr -d ':' | tr 'A-F' 'a-f')
          echo "证书 SHA-256: $HASH"
          [ -n "$HASH" ] || { echo "取证书指纹失败"; exit 1; }
          TOKEN="$API_TOKEN_IN"
          [ -n "$TOKEN" ] || TOKEN='VkSbJok1qA6HXYDbWjEuexRNmCjk20NK'
          cat > fina/manager/auth.properties <<EOF
          api.token=$TOKEN
          app.signature.hash=$HASH
          EOF
          cat fina/manager/auth.properties
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK 组件（含 canary 源，FinaSU 用 SDK 37）
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses >/dev/null 2>&1 || true
          for CH in "" "--channel=3" "--channel=2" "--channel=1"; do
            echo "== 尝试渠道: ${CH:-stable}"
            $SDKM $CH --install "platform-tools" >/dev/null 2>&1 || true
            if $SDKM $CH --install "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" 2>&1 | tail -3; then
              if $SDKM --list_installed 2>/dev/null | grep -q 'platforms;android-37'; then
                echo "SDK 37 安装成功（渠道 ${CH:-stable}）"
                break
              fi
            fi
          done
          $SDKM --list_installed | grep -E 'platforms;android-3|build-tools;3|ndk;' | head -10

      - name: 构建 manager
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cp "$RUNNER_TEMP/key.jks" fina/manager/key.jks 2>/dev/null || true
          cd fina/manager
          chmod +x gradlew
          PKG_ARG=""
          if [ -n "${{ github.event.inputs.manager_package }}" ]; then
            PKG_ARG="-PKSU_PACKAGE_NAME=${{ github.event.inputs.manager_package }}"
            echo "管理器包名: ${{ github.event.inputs.manager_package }}"
          fi
          set +e
          ./gradlew :app:assembleRelease --no-daemon \
            ${PKG_ARG} \
            -PKEYSTORE_FILE=key.jks \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD" > /tmp/gradle.log 2>&1
          RC=$?
          echo "gradle 退出码: $RC"
          if [ $RC -ne 0 ]; then
            echo "=== Kotlin/编译错误 ==="
            grep -E '^e: |^w: .*KpmBridge|error:|Unresolved|BUILD FAILED' /tmp/gradle.log | head -40
            echo "=== 末尾日志 ==="
            tail -25 /tmp/gradle.log
            exit 1
          fi
          tail -5 /tmp/gradle.log

      - name: 检查 gradle 产物
        run: |
          find fina/manager/app/build/outputs -name '*.apk' -exec ls -lh {} \;

      - name: 下载官方 ksud（v1.7.0-beta9 release 的 APK 内 libksud.so）
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          # 官方 APK 里的 libksud.so 才是与管理器配套的 ksud（支持 plugin 等子命令）；
          # kernel-bundle.zip 里那份较旧，会让"插件"等页面报 unrecognized subcommand
          URL="https://github.com/LyraVoid/FinaSU/releases/download/v1.7.0-beta9/FinaSU_v1.7.0-beta9_33232-release.apk"
          curl -L --retry 3 -m 600 -o /tmp/kb.apk "$URL"
          ls -lh /tmp/kb.apk
          rm -rf /tmp/kb && mkdir -p /tmp/kb && unzip -q /tmp/kb.apk 'lib/*' -d /tmp/kb
          echo "--- bundle 里的 ksud 相关文件 ---"
          find /tmp/kb -iname '*ksud*' -maxdepth 4 | head -10
          echo "--- 完整文件清单（前 20）---"
          find /tmp/kb -type f | head -20
          # bundle 里可能是 ksud/android-arm64 这类结构，也可能直接是 ksud
          KSUD_ARM=$(find /tmp/kb -type f -name "libksud.so" | grep -i arm64 | head -1)
          [ -n "$KSUD_ARM" ] || KSUD_ARM=$(find /tmp/kb -type f -name "libksud.so" | head -1)
          [ -n "$KSUD_ARM" ] || KSUD_ARM=$(find /tmp/kb -type f | grep -i ksud | head -1)
          [ -n "$KSUD_ARM" ] || { echo "bundle 里找不到 ksud"; exit 1; }
          echo "选用: $KSUD_ARM ($(stat -c %s "$KSUD_ARM") 字节)"
          mkdir -p fina/target/aarch64-linux-android/release
          cp -f "$KSUD_ARM" fina/target/aarch64-linux-android/release/ksud
          chmod +x fina/target/aarch64-linux-android/release/ksud
          echo "ksud-aarch64-linux-android=$(stat -c %s fina/target/aarch64-linux-android/release/ksud)" >> $GITHUB_OUTPUT

      - name: 注入 libksud.so 并重签（repack_apk.py）
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          cp "$RUNNER_TEMP/key.jks" fina/key.jks
          cd fina
          echo "--- repack 前 APK ---"
          find manager/app/build/outputs -name '*.apk' -exec ls -lh {} \;
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -K "$PWD/key.jks" \
            -A "$KEY_ALIAS" \
            -P "$KEYSTORE_PASSWORD" \
            -S "$KEY_PASSWORD" \
            --no-strip \
            -o "$PWD/../out" 2>&1 | tail -30
          echo "--- repack 后 ---"
          ls -lh "$PWD/../out" || true

      - name: 校验最终 APK（签名与 libksud）
        run: |
          APK=$(find out -name '*.apk' | head -1)
          echo "APK: $APK ($(stat -c %s "$APK") 字节)"
          unzip -l "$APK" | grep -E 'libksud|lib/(arm64|x86_64|riscv64)' | head -10
          python3 - "$APK" <<'PYCHK'
          import struct, hashlib, sys
          data = open(sys.argv[1], 'rb').read()
          eocd = data.rfind(b'PK\x05\x06')
          cd_off = struct.unpack('<I', data[eocd+16:eocd+20])[0]
          size_footer = struct.unpack('<Q', data[cd_off-24:cd_off-16])[0]
          blk = data[cd_off-size_footer-8:cd_off]
          def lp(b, o):
              n = struct.unpack('<I', b[o:o+4])[0]
              return b[o+4:o+4+n], o+4+n
          pos = 8
          while pos < len(blk) - 24:
              ln = struct.unpack('<Q', blk[pos:pos+8])[0]
              pid = struct.unpack('<I', blk[pos+8:pos+12])[0]
              if pid == 0x7109871a:
                  v = blk[pos+12:pos+8+ln]
                  signers, _ = lp(v, 0)
                  signer, _ = lp(signers, 0)
                  signed, _ = lp(signer, 0)
                  _, o2 = lp(signed, 0)
                  certs, _ = lp(signed, o2)
                  cert, _ = lp(certs, 0)
                  print('cert size =', len(cert), 'hash =', hashlib.sha256(cert).hexdigest())
                  break
              pos += 8 + ln
          PYCHK

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: FinaSU-Manager-custom
          path: out/*.apk
