name: Build ksud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: true
      pack_ksuinit:
        required: false
        type: boolean
        default: true
      use_cache:
        required: false
        type: boolean
        default: true
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: Build ksud (${{ inputs.target }})
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Prepare LKM fies
        if: ${{ inputs.pack_lkm }}
        run: |
          cp aarch64-android*-lkm/*_kernelsu.ko ./userspace/ksud/bin/aarch64/
          cp x86_64-android*-lkm/*_kernelsu.ko ./userspace/ksud/bin/x86_64/

      - name: Prepare ksuinit
        if: ${{ inputs.pack_ksuinit }}
        run: |
          mv ksuinit-aarch64/ksuinit ./userspace/ksud/bin/aarch64/
          mv ksuinit-x86_64/ksuinit ./userspace/ksud/bin/x86_64/
          mv ksuinit-riscv64/ksuinit ./userspace/ksud/bin/riscv64/
          mv ksuinit-armv7/ksuinit ./userspace/ksud/bin/arm/

      - name: Setup Rust toolchain
        if: ${{ inputs.target != 'riscv64-linux-android' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: ${{ inputs.target }}
          components: rust-src
      
      - name: Setup Rust toolchain
        if: ${{ inputs.target == 'riscv64-linux-android' }}
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ksud-${{ inputs.target }}
          workspaces: userspace/ksud
          cache-directories: userspace/ksuinit/target
          cache-targets: true
          add-job-id-key: false
          add-rust-environment-hash-key: false
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Setup cargo-ndk
        if: ${{ inputs.target != 'riscv64-linux-android' }}
        run: cargo install cargo-ndk --locked

      - name: Assemble LKM bootstrap
        run: |
          clang --target=aarch64-linux-gnu -c -nostdlib \
            -o userspace/ksud/.lkm_image_bootstrap.o \
            userspace/ksud/src/lkm_image_bootstrap.S

      - name: 版本号对齐上游 BakaSU 提交数
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' >> $GITHUB_ENV
          import os, re, urllib.request
          token = os.environ.get("GH_TOKEN", "")
          url = "https://api.github.com/repos/Baka-SU/BakaSU/commits?sha=main&per_page=1"
          req = urllib.request.Request(url)
          if token:
              req.add_header("Authorization", "Bearer " + token)
          with urllib.request.urlopen(req, timeout=30) as r:
              link = r.headers.get("Link", "")
          m = re.search(r'[?&]page=(\d+)>; rel="last"', link)
          n = int(m.group(1)) if m else 0
          vc = 30000 + n + 700 if n else 0
          print("KSU_VERSION_OVERRIDE=%d" % vc)
          print("KSU_VERSION_NAME_OVERRIDE=4.2.0-rc3")
          PY
          echo "upstream versionCode=${KSU_VERSION_OVERRIDE:-0}"

      - name: Build ksud
        run: |
          if [ "${{github.event_name}}" == "pull_request" ]; then
            export KSU_PACKAGE_NAME="com.resukisu.resukisu.pr${{github.event.pull_request.number}}"
          elif [ "${{github.ref_type}}" != "tag" ] && [ "${{github.ref_name}}" != "main" ]; then
            export KSU_PACKAGE_NAME="com.resukisu.resukisu.dev"
          fi

          if [ "${{ inputs.target }}" == "riscv64-linux-android" ]; then
            source .github/scripts/setup-rust-build.sh riscv64-linux-android 35
            cd userspace/ksud/ 
            cargo +nightly build -Z build-std=std,panic_abort --target "$TRIPLE" --release --manifest-path ./Cargo.toml --config ../../.github/riscv64-cargo.toml
          else
            cd userspace/ksud/
            cargo ndk b -P 26 -t ${{ inputs.target }} -r -Z build-std-features="optimize_for_size" -Z trim-paths
          fi

      - name: Upload ksud artifact
        uses: actions/upload-artifact@v7
        with:
          name: ksud-${{ inputs.target }}
          path: userspace/ksud/target/**/release/ksud*