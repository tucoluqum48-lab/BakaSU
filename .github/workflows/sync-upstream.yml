name: Sync Upstream

on:
  schedule:
    - cron: '0 20 * * *'   # 每天 UTC 20:00 = 北京 04:00
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebase onto upstream
        id: rebase
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Baka-SU/BakaSU.git || true
          git fetch upstream main
          BEFORE=$(git rev-parse HEAD)
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'already up to date'
            echo changed=false >> $GITHUB_OUTPUT
            exit 0
          fi
          git rebase upstream/main
          echo changed=true >> $GITHUB_OUTPUT
          echo "before=$BEFORE" >> $GITHUB_OUTPUT

      - name: Sync managerVersionCode
        if: steps.rebase.outputs.changed == 'true'
        run: |
          set -euo pipefail
          N=$(git rev-list --count upstream/main)
          VER=$((30000 + N + 700))
          echo "upstream commits=$N -> versionCode=$VER"
          python3 - "$VER" <<'PY'
          import re, sys
          p = 'manager/build.gradle.kts'
          s = open(p).read()
          s2 = re.sub(r'extra\["managerVersionCode"\] = \d+',
                      'extra["managerVersionCode"] = ' + sys.argv[1], s)
          if s2 == s and ('extra["managerVersionCode"] = ' + sys.argv[1]) not in s:
              sys.exit('managerVersionCode not found')
          open(p, 'w').write(s2)
          PY
          git add -A
          git commit -m "chore(manager): versionCode 对齐上游 $VER" || true

      - name: Push
        if: steps.rebase.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Trigger Build Manager
        if: steps.rebase.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-manager.yml --ref main
